{% load static %}

<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}LuxStore{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/app.css' %}"
    >
</head>

<body>

    <div
        x-data="{ menuAbierto: false }"
        class="app"
    >

        <!-- Barra superior -->
        <header class="app-header">

            <button
                type="button"
                class="menu-button"
                @click="menuAbierto = true"
                aria-label="Abrir menú"
            >
                ☰
            </button>

            <div class="app-brand">
                LuxStore
            </div>

            <div
                class="user-menu"
                x-data="{ abierto: false }"
            >
                <button
                    type="button"
                    class="user-menu-button"
                    @click="abierto = !abierto"
                    @keydown.escape.window="abierto = false"
                >
                    <span class="user-name">Admin</span>

                    <span class="user-avatar">
                        A
                    </span>

                    <span
                        class="user-chevron"
                        :class="{ 'user-chevron-open': abierto }"
                    >
                        ▾
                    </span>
                </button>

                <div
                    x-show="abierto"
                    x-transition
                    @click.outside="abierto = false"
                    class="user-dropdown"
                    style="display: none;"
                >
                    <button type="button">
                        Mi cuenta
                    </button>

                    <button type="button">
                        Cambiar contraseña
                    </button>

                    <div class="user-dropdown-divider"></div>

                    <button
                        type="button"
                        class="user-dropdown-danger"
                    >
                        Cerrar sesión
                    </button>
                </div>
            </div>

        </header>


        <!-- Fondo del menú -->
        <div
            x-show="menuAbierto"
            x-transition.opacity
            class="menu-overlay"
            @click="menuAbierto = false"
            @keydown.escape.window="menuAbierto = false"
            style="display: none;"
        ></div>


        <!-- Menú lateral -->
        <aside
            x-show="menuAbierto"
            x-transition:enter="menu-enter"
            x-transition:enter-start="menu-enter-start"
            x-transition:enter-end="menu-enter-end"
            x-transition:leave="menu-leave"
            x-transition:leave-start="menu-leave-start"
            x-transition:leave-end="menu-leave-end"
            class="side-menu"
            style="display: none;"
        >

            <div class="side-menu-header">
                <div>
                    <strong>LuxStore</strong>
                    <small>by TheLuxCodes</small>
                </div>

                <button
                    class="menu-close"
                    @click="menuAbierto = false"
                >
                    ×
                </button>
            </div>

            <nav class="side-menu-nav">

                <a href="#">
                    Venta
                </a>

                <a href="{% url 'productos:lista' %}">
                    Productos
                </a>

                <a href="#">
                    Inventario
                </a>

                <a href="#">
                    Corte diario
                </a>

                <a href="#">
                    Usuarios
                </a>

                <a href="#">
                    Configuración
                </a>

            </nav>

        </aside>


        <!-- Contenido -->
        <main class="app-content">

            {% block content %}
            {% endblock %}

        </main>

    </div>


    <script
        src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"
    ></script>

    <script
        defer
        src="{% static 'vendor/alpine/alpine.min.js' %}"
    ></script>

    <script
        src="{% static 'js/app.js' %}"
    ></script>

</body>
</html>
